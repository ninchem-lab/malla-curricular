<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mi Malla Curricular</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    .curso {
      border: 1px solid #ccc;
      padding: 10px;
      margin: 10px 0;
      border-radius: 8px;
    }
    .bloqueado { opacity: 0.4; }
    button { margin-top: 5px; }
  </style>
</head>
<body>

<h1>📘 Mi Malla Curricular</h1>

<div id="mate1" class="curso">
  <b>Matemática Básica</b><br>
  <button onclick="aprobar('mate2')">Aprobar</button>
</div>

<div id="mate2" class="curso bloqueado">
  <b>Matemática Básica II</b><br>
  <button disabled>Aprobar</button>
</div>

<script>
function aprobar(id) {
  const siguiente = document.getElementById(id);
  siguiente.classList.remove('bloqueado');
  siguiente.querySelector('button').disabled = false;
}
</script>

</body>
</html>
